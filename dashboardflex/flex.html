<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Dark Dashboard Layout</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="app">

    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="logo"></div>
      <div class="nav-item"></div>
      <div class="nav-item"></div>
      <div class="nav-item"></div>
      <div class="nav-item"></div>
    </aside>

    <!-- Main Content -->
    <main class="main">

      <!-- Top Row -->
      <section class="top-row">
        <div class="card small"></div>
        <div class="card small"></div>
        <div class="card small"></div>
        <div class="card big highlight"></div>
      </section>

      <!-- Middle Row -->
      <section class="middle-row">
        <div class="card wide"></div>
      </section>

      <!-- Bottom Row -->
      <section class="bottom-row">
        <div class="card medium"></div>
        <div class="card medium"></div>
      </section>

    </main>

  </div>

</body>
</html>
