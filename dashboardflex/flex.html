<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard Layout</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="dashboard">

    <!-- Sidebar -->
    <div class="sidebar">
      <div class="side-icon"></div>
      <div class="side-icon"></div>
      <div class="side-icon"></div>
      <div class="side-icon"></div>
      <div class="side-icon"></div>
    </div>

    <!-- Main -->
    <div class="main">

      <!-- Top row -->
      <div class="top-row">
        <div class="card small"></div>
        <div class="card small"></div>
        <div class="card small"></div>
        <div class="card tall purple"></div>
      </div>

      <!-- Middle row -->
      <div class="middle-row">
        <div class="card wide"></div>
      </div>

      <!-- Bottom row -->
      <div class="bottom-row">
        <div class="card medium"></div>
        <div class="card medium"></div>
      </div>

    </div>

  </div>

</body>
</html>
